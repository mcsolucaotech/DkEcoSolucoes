name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar somente a pasta do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: assets

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
